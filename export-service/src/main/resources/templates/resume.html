<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"/>
    <title th:text="${resume.title}">Resume</title>
    <style>
        @page {
            size: A4;
            margin: 1.5cm;
            @bottom-right {
                content: "Page " counter(page) " of " counter(pages);
                font-family: 'Helvetica', sans-serif;
                font-size: 8pt;
                color: #95a5a6;
            }
        }
        body {
            font-family: 'Helvetica', 'Arial', sans-serif;
            color: #2c3e50;
            line-height: 1.4;
            margin: 0;
            padding: 0;
            background-color: #ffffff;
        }
        .header {
            text-align: center;
            border-bottom: 3px solid #3498db;
            padding-bottom: 15px;
            margin-bottom: 25px;
        }
        .header h1 {
            margin: 0;
            color: #2c3e50;
            font-size: 26pt;
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }
        .header .subtitle {
            margin: 5px 0;
            color: #3498db;
            font-size: 14pt;
            font-weight: bold;
        }
        .header .contact-info {
            font-size: 10pt;
            color: #7f8c8d;
            margin-top: 5px;
        }
        .section {
            margin-bottom: 20px;
        }
        .section-header {
            background-color: #f8f9fa;
            border-left: 5px solid #3498db;
            padding: 5px 10px;
            margin-bottom: 12px;
        }
        .section-title {
            font-size: 13pt;
            color: #2c3e50;
            text-transform: uppercase;
            font-weight: bold;
            margin: 0;
        }
        .content {
            font-size: 10.5pt;
            padding: 0 10px;
            color: #34495e;
            white-space: pre-wrap;
        }
        .item-title {
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 2px;
        }
        .item-subtitle {
            font-style: italic;
            color: #7f8c8d;
            margin-bottom: 5px;
        }
        .footer {
            text-align: center;
            font-size: 8pt;
            color: #bdc3c7;
            margin-top: 30px;
            border-top: 1px solid #ecf0f1;
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1 th:text="${resume.title}">John Doe</h1>
        <div class="subtitle" th:text="${resume.title}">Software Engineer</div>
        <div class="contact-info">
            Generated via Resumade AI &bull; Ref: <span th:text="${resume.id}">123</span>
        </div>
    </div>

    <div th:each="section : ${resume.sections}" class="section">
        <div class="section-header">
            <h2 class="section-title" th:text="${section.title}">Section Title</h2>
        </div>
        <div class="content" th:text="${section.content}">
            Detailed content for this section goes here. It can span multiple lines and will preserve formatting.
        </div>
    </div>

    <div class="footer">
        &copy; <span th:text="${#temporals.format(#temporals.createNow(), 'yyyy')}">2024</span> Resumade AI. All rights reserved. 
        Professional Document generated by JVM-native Flying Saucer.
    </div>
</body>
</html>
