<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        .header { background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 40px 20px; text-align: center; color: white; }
        .header h1 { margin: 0; font-size: 28px; letter-spacing: 1px; }
        .content { padding: 40px 30px; line-height: 1.6; color: #333; }
        .content h2 { color: #764ba2; margin-top: 0; }
        .footer { background-color: #f9f9f9; padding: 20px; text-align: center; font-size: 12px; color: #777; border-top: 1px solid #eee; }
        .btn { display: inline-block; padding: 12px 30px; background: #764ba2; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Resumade</h1>
        </div>
        <div class="content">
            <h2 th:text="'Welcome, ' + ${title} + '!'">Welcome!</h2>
            <p th:text="${message}">Message content goes here.</p>
            <p>We're thrilled to have you join our community of professionals. Start building your career-winning resume today!</p>
            <a href="https://ai-resume-builder-frontend-sandy.vercel.app/dashboard" class="btn">Go to Dashboard</a>
        </div>
        <div class="footer">
            &copy; 2026 Resumade AI. All rights reserved.<br>
            If you didn't create an account, you can safely ignore this email.
        </div>
    </div>
</body>
</html>
