<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; margin: 0; padding: 0; }
        .container { max-width: 600px; margin: 20px auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .header { background: #333; padding: 20px; text-align: center; color: white; }
        .content { padding: 30px; line-height: 1.6; color: #333; }
        .footer { background-color: #f9f9f9; padding: 15px; text-align: center; font-size: 11px; color: #999; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1 style="margin: 0;">Resumade</h1>
        </div>
        <div class="content">
            <h2 th:text="${title}">Notification</h2>
            <p th:text="${message}">Message content goes here.</p>
        </div>
        <div class="footer">
            &copy; 2026 Resumade AI.
        </div>
    </div>
</body>
</html>
