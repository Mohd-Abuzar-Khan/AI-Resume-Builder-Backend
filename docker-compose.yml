services:

  # ─── INFRASTRUCTURE ───────────────────────────────────────────

  mysql:
    image: mysql:8.0
    container_name: resumade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ABmysql14}
      MYSQL_DATABASE: resumade
      MYSQL_USER: ${DB_USER:-Z4RY}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ABmysql14}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-ABmysql14}" ]
      interval: 10s
      timeout: 20s
      retries: 10
    restart: always

  redis:
    image: redis:alpine
    container_name: resumade-redis
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: resumade-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  # ─── MICROSERVICES ────────────────────────────────────────────

  eureka-server:
    image: z4ry/resumade-eureka-server:latest
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - JAVA_OPTS=-Xmx128m
    restart: always

  api-gateway:
    image: z4ry/resumade-api-gateway:latest
    container_name: api-gateway
    ports:
      - "9090:9090"
    depends_on:
      - eureka-server
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - JWT_SECRET=${JWT_SECRET:-GC0AnL4/4Xawm3eHaNxFgS6rt2tM2JoL37SK9VHtdtpXXavwOKvC+ai9FmwnCD36}
      - JAVA_OPTS=-Xmx256m
    restart: always

  auth-service:
    image: z4ry/resumade-auth-service:latest
    container_name: auth-service
    ports:
      - "9091:9091"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=resumade
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - JWT_SECRET=${JWT_SECRET}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://54.79.134.135/auth/google}
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - JAVA_OPTS=-Xmx256m
    restart: always

  template-service:
    image: z4ry/resumade-template-service:latest
    container_name: template-service
    ports:
      - "9092:9092"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=resumade
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - JWT_SECRET=${JWT_SECRET:-GC0AnL4/4Xawm3eHaNxFgS6rt2tM2JoL37SK9VHtdtpXXavwOKvC+ai9FmwnCD36}
      - JAVA_OPTS=-Xmx256m
    restart: always

  resume-service:
    image: z4ry/resumade-resume-service:latest
    container_name: resume-service
    ports:
      - "9093:9093"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=resumade
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - JWT_SECRET=${JWT_SECRET:-GC0AnL4/4Xawm3eHaNxFgS6rt2tM2JoL37SK9VHtdtpXXavwOKvC+ai9FmwnCD36}
      - JAVA_OPTS=-Xmx512m
    restart: always

  ai-service:
    image: z4ry/resumade-ai-service:latest
    container_name: ai-service
    ports:
      - "9094:9094"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=resumade
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JWT_SECRET=${JWT_SECRET:-GC0AnL4/4Xawm3eHaNxFgS6rt2tM2JoL37SK9VHtdtpXXavwOKvC+ai9FmwnCD36}
      - JAVA_OPTS=-Xmx512m
    restart: always

  export-service:
    image: z4ry/resumade-export-service:latest
    container_name: export-service
    ports:
      - "9095:9095"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=resumade
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - RABBITMQ_HOST=rabbitmq
      - JWT_SECRET=${JWT_SECRET:-GC0AnL4/4Xawm3eHaNxFgS6rt2tM2JoL37SK9VHtdtpXXavwOKvC+ai9FmwnCD36}
      - JAVA_OPTS=-Xmx256m
    restart: always

  notification-service:
    image: z4ry/resumade-notification-service:latest
    container_name: notification-service
    ports:
      - "9096:9096"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=resumade
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - RABBITMQ_HOST=rabbitmq
      - MAIL_USER=${MAIL_USER}
      - MAIL_PASSWORD=${MAIL_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - JAVA_OPTS=-Xmx256m
    restart: always

  job-match-service:
    image: z4ry/resumade-job-match-service:latest
    container_name: job-match-service
    ports:
      - "9097:9097"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=resumade
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - JOOBLE_API_KEY=${JOOBLE_API_KEY:-074a6a76-e941-4810-ade7-5586cac14e21}
      - JWT_SECRET=${JWT_SECRET:-GC0AnL4/4Xawm3eHaNxFgS6rt2tM2JoL37SK9VHtdtpXXavwOKvC+ai9FmwnCD36}
      - JAVA_OPTS=-Xmx512m
    restart: always

volumes:
  mysql_data:
