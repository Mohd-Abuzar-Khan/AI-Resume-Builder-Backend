services:
  # --- Infrastructure (MySQL, Redis, RabbitMQ) ---
  mysql:
    image: mysql:8.0
    container_name: resumade-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-ABmysql14} # WARNING: Default credentials in plaintext — use secrets in production
      MYSQL_USER: ${DB_USER:-Z4RY}
      MYSQL_PASSWORD: ${DB_PASSWORD:-ABmysql14}
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init-mysql.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
      timeout: 20s
      retries: 10
    restart: always

  # --- Code Quality ---
  sonarqube-db:
    image: postgres:15
    container_name: sonarqube-db
    environment:
      POSTGRES_USER: sonar
      POSTGRES_PASSWORD: sonar
      POSTGRES_DB: sonar
    volumes:
      - postgresql_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD", "pg_isready", "-U", "sonar" ]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: always

  sonarqube:
    image: sonarqube:9.9-community
    container_name: sonarqube
    ports:
      - "9000:9000"
    depends_on:
      sonarqube-db:
        condition: service_healthy
    environment:
      - SONAR_JDBC_URL=jdbc:postgresql://sonarqube-db:5432/sonar
      - SONAR_JDBC_USERNAME=sonar
      - SONAR_JDBC_PASSWORD=sonar
    volumes:
      - sonarqube_data:/opt/sonarqube/data
      - sonarqube_extensions:/opt/sonarqube/extensions
      - sonarqube_logs:/opt/sonarqube/logs
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    restart: always

  redis:
    # No healthcheck — services may connect before Redis is ready
    image: redis:alpine
    container_name: resumade-redis
    ports:
      - "6379:6379"
    restart: always

  rabbitmq:
    # No healthcheck — consumers may fail on first connection attempt
    image: rabbitmq:3-management-alpine
    container_name: resumade-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    restart: always

  # --- Microservices ---
  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    environment:
      - JAVA_OPTS=-Xmx128m
    restart: always

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    ports:
      - "9090:9090"
    depends_on:
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - JAVA_OPTS=-Xmx256m
    restart: always

  auth-service:
    build: ./auth-service
    container_name: auth-service
    ports:
      - "9091:9091"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - REDIS_HOST=redis
      - RABBITMQ_HOST=rabbitmq
      - GEMINI_API_KEY=${GEMINI_API_KEY} # Not used by auth-service — only needed by ai-service and job-match
      - JOOBLE_API_KEY=${JOOBLE_API_KEY} # Not used by auth-service — only needed by job-match
      - JAVA_OPTS=-Xmx256m
    restart: always

  template-service:
    build: ./template-service
    container_name: template-service
    ports:
      - "9092:9092"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - JAVA_OPTS=-Xmx256m
    restart: always

  resume-service:
    build: ./resume-service
    container_name: resume-service
    ports:
      - "9093:9093"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - JAVA_OPTS=-Xmx512m
    restart: always

  ai-service:
    build: ./ai-service
    container_name: ai-service
    ports:
      - "9094:9094"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - JAVA_OPTS=-Xmx512m
    restart: always

  export-service:
    build: ./export-service
    container_name: export-service
    ports:
      - "9095:9095"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - RABBITMQ_HOST=rabbitmq
      - JAVA_OPTS=-Xmx256m
    restart: always

  notification-service:
    build: ./notification-service
    container_name: notification-service
    ports:
      - "9096:9096"
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_started
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - RABBITMQ_HOST=rabbitmq
      - JAVA_OPTS=-Xmx256m
    restart: always

  job-match-service:
    build: ./job-match-service
    container_name: job-match-service
    ports:
      - "9097:9097"
    depends_on:
      mysql:
        condition: service_healthy
      eureka-server:
        condition: service_started
    environment:
      - EUREKA_URL=http://eureka-server:8761/eureka
      - DB_HOST=mysql
      - DB_USER=${DB_USER:-Z4RY}
      - DB_PASSWORD=${DB_PASSWORD:-ABmysql14}
      - JOOBLE_API_KEY=${JOOBLE_API_KEY}
      - JAVA_OPTS=-Xmx512m
    restart: always

volumes:
  mysql_data:
  postgresql_data:
  sonarqube_data:
  sonarqube_extensions:
  sonarqube_logs:
